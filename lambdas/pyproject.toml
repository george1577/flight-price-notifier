[project]
name = "flight-lambdas"
version = "0.1.0"
description = "Flight Price Notifier AWS Lambdas. This file only drives the test harness: the Lambda runtime uses stdlib + boto3."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.34",
    "moto[dynamodb,s3,sqs,secretsmanager]>=5.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
