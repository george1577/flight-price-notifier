AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Flight Price Notifier M1 (free notifier). Single stack, us-east-1, no VPC, no SNS.
  Deploy with `aws cloudformation package` + `deploy` (see infra/README.md): each
  Lambda's Code points at its local lambdas/<function-name>/ directory.

# Conventions for later tickets:
# - Add resources here; never create M1 resources by hand.
# - IAM: every Lambda uses FlightLambdaRole. MERGE new statements into its single
#   `flight-data` inline policy below; never drop or replace existing statements.
# - Lambdas: python3.12, handler index.handler, Code: ../lambdas/<function-name>/

Parameters:
  SiteUrl:
    Type: String
    Description: >-
      Public URL of the SPA (no trailing slash), e.g. https://<project>.vercel.app.
      flight-ecpay-result redirects the browser to <SiteUrl>/app after ECPay's cashier.
    AllowedPattern: ^https://\S+$

Rules:
  OnlyUsEast1:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: Flight Price Notifier M1 must be deployed in us-east-1.

Resources:
  # ---------------------------------------------------------------- DynamoDB
  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: subscriptions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: email, AttributeType: S }
        - { AttributeName: route, AttributeType: S }
      KeySchema:
        - { AttributeName: email, KeyType: HASH }
        - { AttributeName: route, KeyType: RANGE }

  NotificationHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: notification_history
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S } # "{email}#{route}"
        - { AttributeName: sent_at, AttributeType: S } # ISO-8601 UTC string
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sent_at, KeyType: RANGE }

  # --------------------------------------------------------------------- SQS
  # Match messages from flight-parser (contract: spec #5). VisibilityTimeout must stay
  # strictly greater than the consumer Lambda's timeout (~6x: 180s vs FareNotificationFunction's 30s).
  FlightFareQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: flight-fare-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600 # 4 days

  # M2 (#20): welcome / cancel status messages -> flight-status-notification (contract:
  # spec #16). VisibilityTimeout ~6x StatusNotificationFunction's 30s timeout.
  FlightStatusQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: flight-status-queue
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600 # 4 days

  # --------------------------------------------------------------------- IAM
  FlightLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: flight-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: flight-data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: FlightSecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:flight/*
              - Sid: FlightTables
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SubscriptionsTable.Arn
                  - !GetAtt NotificationHistoryTable.Arn
              - Sid: FlightFareQueueSend # flight-parser enqueues matches
                Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: !GetAtt FlightFareQueue.Arn
              - Sid: FlightConfigObjects # flight-parser-wrapper reads flight-routes.json (read-only)
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:aws:s3:::flight-config-${AWS::AccountId}/flight-routes.json
              - Sid: FlightParserInvoke # flight-parser-wrapper fans out per route
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:flight-parser
              # flight-fare-notification's event-source mapping needs ALL THREE, or it
              # silently never polls.
              - Sid: FlightFareQueueConsume
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FlightFareQueue.Arn
              # M2 (#20): flight-ecpay-return (welcome) and, from #21, flight-cancel-subscription
              # (cancel) enqueue status messages.
              - Sid: FlightStatusQueueSend
                Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                Resource: !GetAtt FlightStatusQueue.Arn
              # flight-status-notification's event-source mapping: all three, or it never polls.
              - Sid: FlightStatusQueueConsume
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FlightStatusQueue.Arn

  # ----------------------------------------------------------------- Lambdas
  # M2 (#17): writes pending_payment + returns the ECPay checkout form. Reads flight/ecpay
  # (covered by FlightSecrets); the callback URLs are built from API_BASE_URL.
  SaveSubscriptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-save-subscription
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code: ../lambdas/flight-save-subscription/
      Environment:
        Variables:
          API_BASE_URL: !Sub https://${FlightApi}.execute-api.${AWS::Region}.amazonaws.com
          # ECPay billing period (#22). To test renewals set D / 1 / 2 (daily, two charges),
          # pay once, check flight-ecpay-period the next day, then switch back to M / 1 / 999.
          PERIOD_TYPE: "M"
          FREQUENCY: "1"
          EXEC_TIMES: "999"

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-parser
      Description: One route per invocation; cheapest Travelpayouts fare -> flight-fare-queue matches.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 60
      MemorySize: 128
      Code: ../lambdas/flight-parser/
      Environment:
        Variables:
          QUEUE_NAME: !GetAtt FlightFareQueue.QueueName

  # ------------------------------------------------- Scheduled check (#8)
  # Admin-managed routes list. CFN can't upload objects: after the stack deploys, copy
  # infra/flight-routes.json into this bucket (see infra/README.md).
  FlightConfigBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub flight-config-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ParserWrapperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-parser-wrapper
      Description: Reads flight-routes.json from S3; async-invokes flight-parser once per route.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Code: ../lambdas/flight-parser-wrapper/
      Environment:
        Variables:
          CONFIG_BUCKET: !Ref FlightConfigBucket
          PARSER_FUNCTION: !Ref ParserFunction

  # Change the check frequency here only (ScheduleExpression); no code change needed.
  FlightPriceCheckRule:
    Type: AWS::Events::Rule
    Properties:
      Name: flight-price-check
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Id: flight-parser-wrapper
          Arn: !GetAtt ParserWrapperFunction.Arn

  FlightPriceCheckPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserWrapperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FlightPriceCheckRule.Arn

  # flight-fare-queue consumer (ticket #9): one match -> one Resend email -> a
  # notification_history row. Timeout 30s; keep FlightFareQueue.VisibilityTimeout ~6x.
  FareNotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-fare-notification
      Description: flight-fare-queue consumer; emails a matched subscriber via Resend.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Code: ../lambdas/flight-fare-notification/
      Environment:
        Variables:
          # Dedup / re-alert thresholds (#10), compared on the TWD price only.
          NOTIFY_FLOOR_HOURS: "24"
          REALERT_PCT: "20"
          REALERT_ABS_TWD: "2000"

  # PURGE flight-fare-queue before this mapping is first created (infra/README.md):
  # it drains the queue at once, and stale test matches burst into Resend 403s/429s.
  # BatchSize 1: a raised 429/5xx redelivers only that message (no re-send of batch-mates).
  FareNotificationQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref FareNotificationFunction
      EventSourceArn: !GetAtt FlightFareQueue.Arn
      BatchSize: 1
      ScalingConfig:
        MaximumConcurrency: 2 # stays under Resend's 5 req/s

  # ---------------------------------------------------------------- HTTP API
  FlightApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: flight-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 3600

  FlightApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref FlightApi
      StageName: $default
      AutoDeploy: true

  SaveSubscriptionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FlightApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SaveSubscriptionFunction.Arn
      PayloadFormatVersion: "2.0"

  SubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FlightApi
      RouteKey: POST /subscribe
      Target: !Sub integrations/${SaveSubscriptionIntegration}

  SaveSubscriptionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SaveSubscriptionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FlightApi}/*/*/subscribe

  # GET /subscriptions?email=... (ticket #6). Needs dynamodb:Query on SubscriptionsTable
  # (already in flight-data) and GET in the FlightApi CORS AllowMethods (already there).
  # Known gap, accepted for M1: the API trusts the client-sent email (no JWT check).
  ListSubscriptionsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-list-subscriptions
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code: ../lambdas/flight-list-subscriptions/

  ListSubscriptionsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FlightApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ListSubscriptionsFunction.Arn
      PayloadFormatVersion: "2.0"

  ListSubscriptionsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FlightApi
      RouteKey: GET /subscriptions
      Target: !Sub integrations/${ListSubscriptionsIntegration}

  ListSubscriptionsApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ListSubscriptionsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FlightApi}/*/*/subscriptions

  # POST /cancel {email, route} (#21): ECPay CreditCardPeriodAction Action=Cancel, then
  # active -> cancelled (keeps current_period_end) and one cancel message on
  # flight-status-queue. Reads flight/ecpay (FlightSecrets), GetItem/UpdateItem on
  # subscriptions (FlightTables), FlightStatusQueueSend. CORS: POST is already allowed.
  # Same known gap as /subscribe: the API trusts the client-sent email (no JWT check).
  CancelSubscriptionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-cancel-subscription
      Description: Stops the ECPay recurring order and marks the subscription cancelled (grace period).
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 20 # ECPay call has a 10s timeout
      MemorySize: 128
      Code: ../lambdas/flight-cancel-subscription/
      Environment:
        Variables:
          STATUS_QUEUE_NAME: !GetAtt FlightStatusQueue.QueueName

  CancelSubscriptionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FlightApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CancelSubscriptionFunction.Arn
      PayloadFormatVersion: "2.0"

  CancelRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FlightApi
      RouteKey: POST /cancel
      Target: !Sub integrations/${CancelSubscriptionIntegration}

  CancelSubscriptionApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CancelSubscriptionFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FlightApi}/*/*/cancel

  # ECPay's OrderResultURL (#17): the browser POSTs here after the cashier. A static SPA
  # 405s on a POST, so this Lambda 302s to <SiteUrl>/app?purchase=success|failed.
  # No state changes and no AWS calls: activation is the ReturnURL callback's job.
  EcpayResultFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-ecpay-result
      Description: ECPay OrderResultURL; 302s the browser back to the dashboard.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 5
      MemorySize: 128
      Code: ../lambdas/flight-ecpay-result/
      Environment:
        Variables:
          SITE_URL: !Ref SiteUrl

  EcpayResultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FlightApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EcpayResultFunction.Arn
      PayloadFormatVersion: "2.0"

  EcpayResultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FlightApi
      RouteKey: ANY /ecpay-result
      Target: !Sub integrations/${EcpayResultIntegration}

  EcpayResultApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EcpayResultFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FlightApi}/*/*/ecpay-result

  # ECPay's ReturnURL (#18): the server-to-server callback for the first charge. Verifies
  # the CheckMacValue and flips the row pending_payment -> active. Reads flight/ecpay
  # (FlightSecrets) and does GetItem/UpdateItem on subscriptions (already granted).
  # Each activation enqueues one welcome message (#20, FlightStatusQueueSend).
  EcpayReturnFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-ecpay-return
      Description: ECPay ReturnURL; verifies the first charge and activates the subscription.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code: ../lambdas/flight-ecpay-return/
      Environment:
        Variables:
          STATUS_QUEUE_NAME: !GetAtt FlightStatusQueue.QueueName

  EcpayReturnIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FlightApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EcpayReturnFunction.Arn
      PayloadFormatVersion: "2.0"

  EcpayReturnRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FlightApi
      RouteKey: POST /ecpay-return
      Target: !Sub integrations/${EcpayReturnIntegration}

  EcpayReturnApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EcpayReturnFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FlightApi}/*/*/ecpay-return

  # ECPay's PeriodReturnURL (#22): the server-to-server callback for each renewal charge.
  # Verifies the CheckMacValue; a paid charge moves current_period_end forward, a declined
  # one counts toward ECPay's 6-failure termination. Reads flight/ecpay (FlightSecrets) and
  # does GetItem/UpdateItem on subscriptions (already granted).
  EcpayPeriodFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-ecpay-period
      Description: ECPay PeriodReturnURL; verifies each renewal and extends or expires the subscription.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Code: ../lambdas/flight-ecpay-period/

  EcpayPeriodIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref FlightApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EcpayPeriodFunction.Arn
      PayloadFormatVersion: "2.0"

  EcpayPeriodRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref FlightApi
      RouteKey: POST /ecpay-period
      Target: !Sub integrations/${EcpayPeriodIntegration}

  EcpayPeriodApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EcpayPeriodFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FlightApi}/*/*/ecpay-period

  # ------------------------------------------- Status notifications (#20)
  # The one consumer of flight-status-queue: event_type welcome | cancel -> one Resend
  # email. Reads flight/resend and flight/ecpay (the monthly amount), both FlightSecrets.
  # Timeout 30s; keep FlightStatusQueue.VisibilityTimeout ~6x.
  StatusNotificationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: flight-status-notification
      Description: flight-status-queue consumer; welcome / cancel emails via Resend.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FlightLambdaRole.Arn
      Timeout: 30
      MemorySize: 128
      Code: ../lambdas/flight-status-notification/

  # BatchSize 1: a raised 429/5xx redelivers only that message.
  StatusNotificationQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref StatusNotificationFunction
      EventSourceArn: !GetAtt FlightStatusQueue.Arn
      BatchSize: 1
      ScalingConfig:
        MaximumConcurrency: 2 # stays under Resend's 5 req/s, shared with the fare alerts

Outputs:
  ApiBaseUrl:
    Description: Set the frontend's VITE_FLIGHT_API_URL to this value.
    Value: !Sub https://${FlightApi}.execute-api.${AWS::Region}.amazonaws.com
  FlightLambdaRoleArn:
    Value: !GetAtt FlightLambdaRole.Arn
  SubscriptionsTableName:
    Value: !Ref SubscriptionsTable
  NotificationHistoryTableName:
    Value: !Ref NotificationHistoryTable
  FlightFareQueueUrl:
    Value: !Ref FlightFareQueue
  FlightConfigBucketName:
    Description: Upload infra/flight-routes.json here after deploy.
    Value: !Ref FlightConfigBucket
